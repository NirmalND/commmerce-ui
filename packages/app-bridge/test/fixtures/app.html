<!doctype html>
<meta charset="utf-8">
<title>App Bridge test app</title>
<script type="module">
  // Test app loaded in an iframe. Same-origin tests drive it through window.createApp / window.rawSend.
  // Cross-origin tests (?scenario=...) can't reach in, so it runs a scenario and reports to the parent.
  import { createApp } from '../../src/index.ts';
  window.createApp = createApp;
  window.received = [];
  addEventListener('message', (e) => window.received.push(e.data));
  // The test page calls these. A message's `source` is the window of the script that called postMessage. When
  // the test page called the old one-line helpers here, WebKit 18.2 reported the test page as `source` (Chromium
  // reported this frame), so the admin rejected the messages as "not from the app frame". A <script> of this frame
  // does the posting, which gives this frame as `source` in every engine. A real app only ever posts from its own
  // scripts, so this is a harness issue, not an App Bridge one.
  const outbox = [];
  window.flushOutbox = () => { for (const [target, msg] of outbox.splice(0)) target.postMessage(msg, '*'); };
  const post = (target, msg) => {
    outbox.push([target, msg]);
    const s = document.createElement('script');
    s.textContent = 'flushOutbox()';
    document.head.append(s); // inline scripts run as they are inserted, so this is synchronous
    s.remove();
  };
  window.rawSend = (msg) => post(parent, msg);
  window.postTo = (target, msg) => post(target, msg);
  const q = new URLSearchParams(location.search);
  const report = (result) => parent.postMessage({ testReport: result }, '*');
  if (q.get('scenario') === 'basic') {
    let app;
    try {
      app = createApp({ hostOrigin: q.get('host'), exactHostOrigin: q.get('exact') ?? undefined, timeout: Number(q.get('timeout') ?? 3000) });
    } catch (e) { report({ ok: false, thrown: true, message: e.message }); }
    if (app) {
      try {
        const info = await app.ready;
        await app.toast.show('Saved');
        const token = await app.getSessionToken();
        report({ ok: true, info, token, hostOrigin: app.hostOrigin });
      } catch (e) { report({ ok: false, code: e.code, message: e.message, hostOrigin: app.hostOrigin }); }
    }
  }
  window.appReady = true;
</script>
